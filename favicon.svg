<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark green background -->
  <rect width="100" height="100" rx="16" fill="#1a5228"/>
  <!-- Outer rounded border -->
  <rect x="6" y="6" width="88" height="88" rx="11" fill="none" stroke="white" stroke-width="3" stroke-opacity="0.75"/>
  <!-- Vertical grid lines -->
  <line x1="35.5" y1="6" x2="35.5" y2="94" stroke="white" stroke-width="2" stroke-opacity="0.45"/>
  <line x1="64.5" y1="6" x2="64.5" y2="94" stroke="white" stroke-width="2" stroke-opacity="0.45"/>
  <!-- Horizontal grid lines -->
  <line x1="6" y1="35.5" x2="94" y2="35.5" stroke="white" stroke-width="2" stroke-opacity="0.45"/>
  <line x1="6" y1="64.5" x2="94" y2="64.5" stroke="white" stroke-width="2" stroke-opacity="0.45"/>
  <!-- "3" numeral -->
  <text x="50" y="74" font-family="Arial Black, Impact, 'Helvetica Neue', sans-serif" font-size="62" font-weight="900" text-anchor="middle" fill="white">3</text>
</svg>
